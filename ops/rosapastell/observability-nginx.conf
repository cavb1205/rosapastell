# Private, bounded labels only: never log URI, args, IP, cookies or bodies.
map $request_method $rosa_perf_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
map $request_uri $rosa_perf_route {
    default other;
    ~^/wp-json/wc/v3/products/[0-9]+/variations(?:/|\?|$) product_variations;
    ~^/wp-json/wc/v3/products/reviews(?:/|\?|$) product_reviews;
    ~^/wp-json/wc/v3/products/categories(?:/|\?|$) product_categories;
    ~^/wp-json/wc/v3/products(?:/|\?|$) products;
    ~^/wp-json/wc/v3/rp-checkout/orders(?:/|\?|$) checkout;
    ~^/wp-json/wc/v3/orders(?:/|\?|$) orders;
    ~^/wp-json/rosapastell/v1/store-status(?:\?|$) store_status;
    ~^/wp-json/jwt-auth/ auth;
    ~^/wp-json/wpcom/ jetpack_api;
    ~^/wp-json/jetpack/ jetpack_api;
    ~^/wp-json/ rest_other;
    ~^/wp-admin/admin\.php\?page=stats(?:&|$) jetpack_stats;
    ~^/wp-admin/admin-ajax\.php(?:\?|$) admin_ajax;
    ~^/wp-admin/ admin;
    ~^/wp-login\.php(?:\?|$) login;
    ~^/wp-content/uploads/ uploads;
    ~^/wp-content/ static;
    ~^/wp-includes/ static;
    ~^/__rosa_fpm_status(?:\?|$) status_blocked;
    ~^/(?:\?|$) root;
}
log_format rosa_perf escape=json
    '{"ts":"$time_iso8601","method":"$rosa_perf_method",'
    '"route":"$rosa_perf_route","status":$status,'
    '"total_s":$request_time,"upstream_s":"$upstream_response_time",'
    '"connect_s":"$upstream_connect_time","header_s":"$upstream_header_time",'
    '"bytes":$body_bytes_sent}';
