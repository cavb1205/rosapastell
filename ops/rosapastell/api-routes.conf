root /srv/rosapastell-stage/rosa/site;
index index.php;
add_header X-Rosa-Backend "modern-20261023" always;
access_log /var/log/nginx/rosa-stage-access.log;
access_log /var/log/rosapastell-observability/nginx-timing.jsonl rosa_perf;
location = /__rosa_fpm_status { return 404; }
# Root: `?rest_route=` requests (WooCommerce app, WordPress.com/Jetpack proxy) go to
# WordPress. Otherwise a tiny non-indexable page carrying the REST discovery link that
# WordPress.com and the WooCommerce app need to recognise the site as WordPress; people
# are sent on to the storefront. A plain 302 made both treat the site as non-WordPress.
# add_header here replaces the server-level headers, so they are repeated.
location = / {
    if ($arg_rest_route != "") { rewrite ^ /index.php last; }
    default_type text/html;
    add_header X-Rosa-Backend "modern-20261023" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Link '<https://api.rosapastell.com/wp-json/>; rel="https://api.w.org/"' always;
    return 200 '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="https://api.w.org/" href="https://api.rosapastell.com/wp-json/"><meta http-equiv="refresh" content="0;url=https://www.rosapastell.com/"><title>Rosa Pastell</title></head><body><a href="https://www.rosapastell.com/">www.rosapastell.com</a></body></html>';
}
location ~ /\. { deny all; }
location ~* /wp-config(?:\.php)?(?:$|[./~_-]) { deny all; }
location ~* \.(?:sql|bak|old|orig|save|log|ini|conf|env|sh|gz|zip|tar|age)(?:$|/) { deny all; }
location = /wp-cron.php { return 403; }
location = /xmlrpc.php { return 403; }
location ~* ^/(?:checkout|cart|my-account)(?:/|$) { return 403; }
location ~* ^/wp-json/wc/store/ { return 403; }
location ~* ^/wp-content/uploads/(?:wc-logs|woocommerce_uploads|wpo_wcpdf[^/]*|wpforms)(?:/|$) { deny all; }
location ~* ^/wp-content/(?:uploads|cache)/.*\.(?:php|phtml|phar)(?:/|$) { return 403; }
location /wp-content/uploads/ { try_files $uri =404; expires 1d; }
location / { try_files $uri $uri/ /index.php?$args; }
location ~ \.php$ {
    try_files $uri =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param RP_PERF_ROUTE $rosa_perf_route;
    fastcgi_param RP_PERF_METHOD $rosa_perf_method;
    fastcgi_pass unix:/run/rosa-stage-php/php-fpm.sock;
    fastcgi_read_timeout 90s;
}
